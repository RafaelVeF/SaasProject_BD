version: '3.8'
services:
  db:
    image: mongo:6.0
    container_name: saas_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=saas_db
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: saas_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://admin:password@db:27017/saas_db?authSource=admin}
      - PORT=${PORT:-5000}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: saas_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data: